[project]
name = "simpo"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10.9,<4.0"

dependencies = [
    "torch>=2.1.2",
    "deepspeed>=0.14",
    "wandb>=0.18.2",
    # git‐based dep
    "alignment-handbook",
    "hatchling>=1.27.0",
    "wheel>=0.45.1",
    "setuptools>=80.9.0",
    "editables>=0.5",
    "flash-attn>=2.7.4.post1",
]

[dependency-groups]
dev = [
    "pytest",
    "ipykernel>=6.29.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simpo"]

[tool.uv.sources]
alignment-handbook = { git = "https://github.com/huggingface/alignment-handbook.git" }
